[STATE]

; last opened map file (empty on a clean install)
last_map =

; default MIDI file to play on startup
default_midi = M_MUS04

; volumes {0 to 100}
sound_volume = 70
music_volume = 30

; default window size
win_x_size = 1280
win_y_size = 960
win_maximize = true


[SPELCROS]

; Legacy directory hints. Leave empty on a clean install.
; On first run the application can import original data from a Spellcross CD / mounted ISO
; or ask for the individual original archive files.
spell_path =
spellcd_path =


[DATA]

; additional program data folder
spec_data_path = data\

; additional metadata for units.fsu
units_aux_data_path = data\units.fsa


[TERRAIN::T11]
context_path = data\T11.con


[TERRAIN::PUST]
context_path =


[TERRAIN::DEVAST]
context_path =
